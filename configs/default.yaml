# Default configuration for 3DGS tutorials

# Training settings
training:
  iterations: 30000
  batch_size: 1

  # Learning rates
  learning_rate:
    position: 0.00016
    scaling: 0.005
    rotation: 0.001
    opacity: 0.05
    features: 0.0025

  # Density control
  densification:
    start_iter: 500
    end_iter: 15000
    interval: 100
    grad_threshold: 0.0002
    opacity_threshold: 0.005

  # Loss weights
  loss:
    lambda_dssim: 0.2

# Gaussian settings
gaussian:
  sh_degree: 3
  initial_opacity: 0.5

# Rendering settings
rendering:
  background: white  # or black

# Data settings
data:
  image_scale: 1.0
  white_background: true
